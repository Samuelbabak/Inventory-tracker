name: haynes-inventory

x-backend-environment: &backend-environment
  INVENTORY_ENVIRONMENT: development
  INVENTORY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  INVENTORY_AUTH_PROVIDER: local
  INVENTORY_SECURE_COOKIES: "false"
  INVENTORY_ALLOWED_HOSTS: '["localhost","127.0.0.1","gateway","api"]'
  INVENTORY_SPECTRUM_ADAPTER: fake
  INVENTORY_WORKER_POLL_SECONDS: "2"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp

  seed:
    build:
      context: ./backend
    command: ["python", "-m", "app.seed"]
    environment:
      <<: *backend-environment
      INVENTORY_SEED_PASSWORD: ${INVENTORY_SEED_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp

  api:
    build:
      context: ./backend
    environment: *backend-environment
    depends_on:
      seed:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp
    init: true
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.workers.outbox"]
    environment: *backend-environment
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    init: true
    restart: unless-stopped

  gateway:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${INVENTORY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/api/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  postgres-data:
